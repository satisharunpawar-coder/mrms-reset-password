<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRMS Password Reset</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://jmrhddupmaefqubjemux.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_d-ZyYxPlegxRbN3wAWnOAg_h9oA-eb1";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);
</script>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:40px;
    width:420px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    text-align:center;
}

h1{
    color:#1565C0;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    background:#1565C0;
    color:white;
    border:none;
    border-radius:6px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#0D47A1;
}

#message{
    margin-top:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>MRMS Password Reset</h1>

<input
type="password"
id="password"
placeholder="Enter New Password">

<input
type="password"
id="confirm"
placeholder="Confirm Password">

<button onclick="resetPassword()">
Reset Password
</button>

<p id="message"></p>

</div>

<script>

async function resetPassword(){
    const { data: { session } } = await supabase.auth.getSession();

if (!session) {
    document.getElementById("message").style.color = "red";
    document.getElementById("message").innerHTML =
        "Invalid or expired password reset link.";
    throw new Error("No active session");
}

const password=document.getElementById("password").value;
const confirm=document.getElementById("confirm").value;
const message=document.getElementById("message");

if(password!==confirm){
message.style.color="red";
message.innerHTML="Passwords do not match.";
return;
}

const {error}=await supabase.auth.updateUser({
password:password
});

if(error){
message.style.color="red";
message.innerHTML=error.message;
}
else{
message.style.color="green";
message.innerHTML="Password changed successfully. You can close this page.";
}

}

</script>

</body>
</html>
